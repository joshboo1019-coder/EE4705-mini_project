[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minilab-1-3-backbone"
version = "0.1.0"
description = "EE4705 MiniLab 1.3: LLM + YOLO powered quadruped — simulation backbone and Student A/B/C modules"
requires-python = ">=3.10"
dependencies = [
    "mujoco",
    "numpy",
    "onnxruntime",
    "pyyaml",
    "pillow",
    "ultralytics",
    "openai",
]

[project.optional-dependencies]
dev = [
    "opencv-python",   # Student C: color grounding
    "pytest",
]
gemini = ["google-genai"]     # Student B, if comparing Gemini
qwen = ["dashscope"]          # Student B, if not using the OpenAI-compatible endpoint

[tool.setuptools.packages.find]
include = ["core*", "skills*", "dialogue*", "perception*"]
