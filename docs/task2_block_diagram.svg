    <text x="780.0" y="38" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1a1a1a">Task 2 Control Pipeline — RealSkills / _sim_loop</text><text x="780.0" y="60" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#555555">Both lanes run inside the same background thread — one render/physics/policy iteration advances both every tick</text><rect x="30" y="80" width="1500" height="740" rx="14" ry="14" fill="#f7f9fc" stroke="#aab4c2" stroke-width="2" stroke-dasharray="3,3"/><text x="55" y="108" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#555555">skills_real.py: _sim_loop (single background thread, started by RealSkills)</text><text x="55" y="128" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2457a8">Motion control pipeline (every tick, 200 Hz physics)</text><rect x="55" y="140" width="192" height="100" rx="10" ry="10" fill="#dbe9ff" stroke="#2457a8" stroke-width="2"/><text x="151.0" y="163.91666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1a1a1a">Skill call</text><text x="151.0" y="184.41666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">move(vx,vy,wz,dur)</text><text x="151.0" y="204.91666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">turn(angle_deg)</text><text x="151.0" y="225.41666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">run_fast(x,y)</text><rect x="273" y="140" width="192" height="100" rx="10" ry="10" fill="#dbe9ff" stroke="#2457a8" stroke-width="2"/><text x="369.0" y="163.91666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1a1a1a">Build observation</text><text x="369.0" y="184.41666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">46-dim state +</text><text x="369.0" y="204.91666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">6-frame history</text><text x="369.0" y="225.41666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">(build_single_obs)</text><rect x="491" y="140" width="192" height="100" rx="10" ry="10" fill="#dbe9ff" stroke="#2457a8" stroke-width="2"/><text x="587.0" y="163.91666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1a1a1a">ONNX policy</text><text x="587.0" y="184.41666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">inference @ 50 Hz</text><text x="587.0" y="204.91666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">(every 4th</text><text x="587.0" y="225.41666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">physics step)</text><rect x="709" y="140" width="192" height="100" rx="10" ry="10" fill="#dbe9ff" stroke="#2457a8" stroke-width="2"/><text x="805.0" y="163.91666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1a1a1a">Joint order remap</text><text x="805.0" y="184.41666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">IsaacGym -&gt;</text><text x="805.0" y="204.91666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">MuJoCo leg/</text><text x="805.0" y="225.41666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">joint ordering</text><rect x="927" y="140" width="192" height="100" rx="10" ry="10" fill="#dbe9ff" stroke="#2457a8" stroke-width="2"/><text x="1023.0" y="174.16666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1a1a1a">PD torque loop</text><text x="1023.0" y="194.66666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">@ 200 Hz physics</text><text x="1023.0" y="215.16666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">(decimation = 4)</text><rect x="1145" y="140" width="192" height="100" rx="10" ry="10" fill="#dbe9ff" stroke="#2457a8" stroke-width="2"/><text x="1241.0" y="174.16666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1a1a1a">MuJoCo physics step</text><text x="1241.0" y="194.66666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">mj_step(model, data)</text><text x="1241.0" y="215.16666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">robot actuation</text><line x1="247" y1="190.0" x2="273" y2="190.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrowhead)"/><line x1="465" y1="190.0" x2="491" y2="190.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrowhead)"/><line x1="683" y1="190.0" x2="709" y2="190.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrowhead)"/><line x1="901" y1="190.0" x2="927" y2="190.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrowhead)"/><line x1="1119" y1="190.0" x2="1145" y2="190.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrowhead)"/><rect x="1102" y="295" width="235" height="55" rx="10" ry="10" fill="#fff2cf" stroke="#b8860b" stroke-width="2"/><text x="1219.5" y="317.1666666666667" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14.0" font-weight="700" fill="#1a1a1a">mj_data.qpos</text><text x="1219.5" y="336.1666666666667" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1a1a1a">atan2(2(wz*xy), 1-2(y^2+z^2))</text><line x1="1297" y1="240" x2="1297" y2="295" stroke="#555555" stroke-width="2.2" marker-end="url(#arrowhead)"/><text x="1219.5" y="287" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#555555">reads true yaw from</text><path d="M 1132 350 C 852 465, 529.8 370, 179.8 240" fill="none" stroke="#b8860b" stroke-width="2.4" marker-end="url(#arrowhead)"/><text x="55" y="488" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2a8f3f">Camera / perception pipeline (same thread, every tick, throttled to CAMERA_HZ)</text><rect x="55" y="500" width="225" height="100" rx="10" ry="10" fill="#dff6e0" stroke="#2a8f3f" stroke-width="2"/><text x="167.5" y="523.9166666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1a1a1a">Rate throttle</text><text x="167.5" y="544.4166666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">render only every</text><text x="167.5" y="564.9166666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">Nth tick so renders</text><text x="167.5" y="585.4166666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">land at CAMERA_HZ = 15 Hz</text><rect x="304" y="500" width="225" height="100" rx="10" ry="10" fill="#dff6e0" stroke="#2a8f3f" stroke-width="2"/><text x="416.5" y="523.9166666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1a1a1a">Offscreen render</text><text x="416.5" y="544.4166666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">dog_front_camera via its</text><text x="416.5" y="564.9166666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">own mujoco.Renderer</text><text x="416.5" y="585.4166666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">(separate from viewer/panel)</text><rect x="553" y="500" width="225" height="100" rx="10" ry="10" fill="#dff6e0" stroke="#2a8f3f" stroke-width="2"/><text x="665.5" y="523.9166666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1a1a1a">Publish frame</text><text x="665.5" y="544.4166666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">get_camera_frame()</text><text x="665.5" y="564.9166666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">returns latest published</text><text x="665.5" y="585.4166666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">frame (non-blocking)</text><rect x="802" y="500" width="225" height="100" rx="10" ry="10" fill="#dff6e0" stroke="#2a8f3f" stroke-width="2"/><text x="914.5" y="534.1666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1a1a1a">YOLO detection</text><text x="914.5" y="554.6666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">(Task 4 / Student C)</text><text x="914.5" y="575.1666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">bbox + class + confidence</text><rect x="1051" y="500" width="225" height="100" rx="10" ry="10" fill="#dff6e0" stroke="#2a8f3f" stroke-width="2"/><text x="1163.5" y="534.1666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1a1a1a">_steer_to_center()</text><text x="1163.5" y="554.6666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">bbox-offset -&gt; proportional</text><text x="1163.5" y="575.1666666666666" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a">wz steering command</text><line x1="280" y1="550.0" x2="304" y2="550.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrowhead)"/><line x1="529" y1="550.0" x2="553" y2="550.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrowhead)"/><line x1="778" y1="550.0" x2="802" y2="550.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrowhead)"/><line x1="1027" y1="550.0" x2="1051" y2="550.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrowhead)"/><path d="M 1163.5 500 C 863.5 330, 422.2 410, 122.19999999999999 240" fill="none" stroke="#2a8f3f" stroke-width="2.4" marker-end="url(#arrowhead)"/><text x="239.8" y="383" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a6d00">closed-loop turn(): reads true yaw back, corrects until |error| &lt; 2 deg</text><text x="239.8" y="403" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1f6b30">steering: _steer_to_center()&#x27;s wz command feeds into the next move()/run_fast() call</text><rect x="55" y="650" width="1430" height="175" rx="10" ry="10" fill="#ffffff" stroke="#cccccc" stroke-width="1.5"/><text x="75" y="674" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#333333">• Why decimation = 4: physics steps at 200 Hz but the ONNX policy only needs fresh actions at 50 Hz (200 / 4 = 50) -- the PD torque loop re-applies the</text><text x="92" y="690" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#333333">same policy output across the 4 intermediate physics steps.</text><text x="75" y="712" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#333333">• Why CAMERA_HZ = 15: inside the handout&#x27;s recommended 10-20 Hz range -- fast enough that steer-to-center sees a near-continuous bbox signal, but far</text><text x="92" y="728" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#333333">below the 50 Hz policy / 200 Hz physics rate so the offscreen render call doesn&#x27;t compete with the control loop for CPU time (see core/config.py&#x27;s own</text><text x="92" y="744" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#333333">comment on CAMERA_HZ).</text><text x="75" y="766" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#333333">• Why the joint remap exists: the ONNX policy was trained in IsaacGym, whose leg/joint ordering differs from MuJoCo&#x27;s -- actions must be permuted to the</text><text x="92" y="782" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#333333">right joint before the PD loop applies them, or torques go to the wrong leg.</text><text x="75" y="804" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#333333">• turn() is closed-loop (reads true yaw back from mj_data.qpos and corrects); move() and run_fast() are open-loop velocity commands with no position</text><text x="92" y="820" text-anchor="start" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#333333">feedback inside this diagram&#x27;s loop -- run_fast() adds its own accelerate/cruise/brake ramp but still no obstacle avoidance.</text></svg>